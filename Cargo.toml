[package]
name = "reqcli"
version = "0.1.0"
edition = "2021"
description = "A terminal-native API tester with YAML collections, variable substitution, extraction, and assertions"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
